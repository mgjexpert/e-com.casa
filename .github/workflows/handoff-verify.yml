name: Handoff verification final pass

on:
  push:
    branches: [handoff/admin-cleanroom]
    paths:
      - '.github/workflows/handoff-verify.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Apply final source corrections
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          configurator = Path('src/components/offers/painel-ripado/configurator.tsx')
          text = configurator.read_text()
          old = '}, [selected, wallHeight, wallWidth]);'
          new = '}, [product.dimensions, selected, wallHeight, wallWidth]);'
          if old in text:
              configurator.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('Expected memo dependency list not found')

          readme = Path('README.md')
          text = readme.read_text()
          old = '''Use a direct/session connection for migrations when required.\n\nSchema changes must be represented in `prisma/schema.prisma` and in the production migration process. Do not make undocumented structural changes directly in Supabase Studio.'''
          new = '''Use a direct/session connection for migrations when required.\n\nThe current production database is already provisioned and the repository's Prisma migrations are incremental; they are not yet a complete fresh-database baseline. Before running `prisma migrate deploy` against a brand-new database, establish and review a baseline from `prisma/schema.prisma`. Do not treat the incremental migration directory as a complete bootstrap for an empty production database.\n\nSchema changes must be represented in `prisma/schema.prisma` and in the production migration process. Do not make undocumented structural changes directly in Supabase Studio.'''
          if old in text:
              readme.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('Expected README migration paragraph not found')

          section_group = re.compile(r'\s*\((?:see prompts\s+)?§\s*\d+(?:\s*[–—-]\s*§?\s*\d+)?(?:\s*,\s*§?\s*\d+)*\)', re.IGNORECASE)
          section_single = re.compile(r'\s+§\s*\d+(?:\s*[–—-]\s*§?\s*\d+)?(?:\s*,\s*§?\s*\d+)*')
          allowed_suffixes = {'.ts', '.tsx', '.js', '.jsx', '.mjs', '.cjs'}

          def clean_comment_line(line: str) -> str:
              newline = '\n' if line.endswith('\n') else ''
              raw = line[:-1] if newline else line
              stripped = raw.lstrip()
              indent = raw[:len(raw) - len(stripped)]

              if stripped.startswith('//'):
                  body = stripped[2:].strip()
                  body = re.sub(r'^[=-]{3,}\s*', '', body)
                  body = re.sub(r'\s*[=-]{3,}$', '', body)
                  body = section_group.sub('', body)
                  body = section_single.sub('', body)
                  body = body.replace('Rules encoded here (see prompts):', 'Rules encoded here:')
                  body = body.replace('Rules encoded here (see prompts', 'Rules encoded here')
                  if not body or body.isdigit():
                      return ''
                  return f'{indent}// {body}{newline}'

              section_pos = raw.find('§')
              if section_pos >= 0:
                  markers = [pos for pos in (raw.find('/*'), raw.find('{/*')) if pos >= 0]
                  if stripped.startswith('*'):
                      markers.append(len(indent))
                  if markers and min(markers) < section_pos:
                      raw = section_group.sub('', raw)
                      raw = section_single.sub('', raw)
              return raw + newline

          for root in [Path('src'), Path('prisma'), Path('scripts'), Path('tests')]:
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix not in allowed_suffixes:
                      continue
                  original = path.read_text()
                  cleaned = ''.join(clean_comment_line(line) for line in original.splitlines(keepends=True))
                  if cleaned != original:
                      path.write_text(cleaned)
          PY
      - name: Install dependencies and refresh lockfile
        run: |
          bun install
          python - <<'PY'
          from pathlib import Path
          path = Path('bun.lock')
          text = path.read_text()
          path.write_text(text.replace('"name": "nextjs_tailwind_shadcn_ts"', '"name": "e-com-casa"', 1))
          PY
      - name: Lint
        run: bun run lint
      - name: Catalogue inventory tests
        run: bun test tests/catalog-inventory.test.ts
      - name: Catalogue payment tests
        run: bun test tests/catalog-payment.test.ts
      - name: Commerce policy tests
        run: bun test tests/commerce-policy.test.ts
      - name: Product offer tests
        run: bun test tests/product-offers.test.ts
      - name: Funnel template tests
        run: bun test tests/offer-funnel-template.test.ts
      - name: Source hygiene audit
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          failures = []
          roots = [Path('src'), Path('prisma'), Path('scripts'), Path('tests')]
          allowed_suffixes = {'.ts', '.tsx', '.js', '.jsx', '.mjs', '.cjs'}
          forbidden_text = re.compile(r'ChatGPT|OpenAI|AI-generated|Generated by AI|🤖|🚀|✨|✅|❌', re.IGNORECASE)
          decorative = re.compile(r'^\s*//\s*[=-]{8,}')

          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix not in allowed_suffixes:
                      continue
                  for number, line in enumerate(path.read_text().splitlines(), 1):
                      if forbidden_text.search(line):
                          failures.append(f'{path}:{number}:{line}')
                          continue
                      if decorative.search(line):
                          failures.append(f'{path}:{number}:{line}')
                          continue
                      section_pos = line.find('§')
                      if section_pos < 0:
                          continue
                      stripped = line.lstrip()
                      markers = [pos for pos in (line.find('//'), line.find('/*'), line.find('{/*')) if pos >= 0]
                      if stripped.startswith('*'):
                          markers.append(len(line) - len(stripped))
                      if markers and min(markers) < section_pos:
                          failures.append(f'{path}:{number}:{line}')

          readme = Path('README.md').read_text()
          if forbidden_text.search(readme):
              failures.append('README.md contains assistant-specific provenance text')

          if failures:
              print('\n'.join(failures))
              raise SystemExit(1)
          PY
      - name: Commit verified source and lockfile
        run: |
          git config user.name 'E-com.casa CI'
          git config user.email 'ci@users.noreply.github.com'
          git add README.md bun.lock src prisma scripts tests
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Finalize source hygiene and handoff verification'
          git push origin HEAD:handoff/admin-cleanroom
