name: Handoff verification

on:
  push:
    branches: [handoff/admin-cleanroom]
    paths:
      - '.github/workflows/handoff-verify.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Apply lint correction
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/offers/painel-ripado/configurator.tsx')
          text = path.read_text()
          old = '}, [selected, wallHeight, wallWidth]);'
          new = '}, [product.dimensions, selected, wallHeight, wallWidth]);'
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('Expected memo dependency list not found')
          PY
      - name: Install dependencies and refresh lockfile
        run: |
          bun install
          python - <<'PY'
          from pathlib import Path
          path = Path('bun.lock')
          text = path.read_text()
          path.write_text(text.replace('"name": "nextjs_tailwind_shadcn_ts"', '"name": "e-com-casa"', 1))
          PY
      - name: Lint
        run: bun run lint
      - name: Catalogue inventory tests
        id: inventory
        continue-on-error: true
        run: bun test tests/catalog-inventory.test.ts
      - name: Catalogue payment tests
        id: payment
        continue-on-error: true
        run: bun test tests/catalog-payment.test.ts
      - name: Commerce policy tests
        id: policy
        continue-on-error: true
        run: bun test tests/commerce-policy.test.ts
      - name: Product offer tests
        id: offers
        continue-on-error: true
        run: bun test tests/product-offers.test.ts
      - name: Funnel template tests
        id: funnel
        continue-on-error: true
        run: bun test tests/offer-funnel-template.test.ts
      - name: Source hygiene audit
        if: always()
        run: |
          grep -RInE '§|// ={8,}|ChatGPT|AI-generated|Generated by AI|🤖|🚀|✨' src prisma tests docs README.md 2>/dev/null || true
      - name: Require all tests
        if: always()
        run: |
          test '${{ steps.inventory.outcome }}' = 'success'
          test '${{ steps.payment.outcome }}' = 'success'
          test '${{ steps.policy.outcome }}' = 'success'
          test '${{ steps.offers.outcome }}' = 'success'
          test '${{ steps.funnel.outcome }}' = 'success'
      - name: Commit verified source and lockfile
        run: |
          git config user.name 'E-com.casa CI'
          git config user.email 'ci@users.noreply.github.com'
          git add bun.lock src/components/offers/painel-ripado/configurator.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Verify handoff source and lockfile'
          git push origin HEAD:handoff/admin-cleanroom
