name: Offers lint and build

on:
  push:
    branches:
      - 'feat/offers-*'
  pull_request:
    paths:
      - 'src/app/offers/**'
      - 'src/components/offers/**'
      - 'src/lib/offers/**'
      - 'src/lib/catalog/**'
      - 'src/lib/checkout.ts'
      - 'src/lib/constants.ts'
      - '.github/workflows/offers-v2-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
  NEXT_PUBLIC_INDEXING_ENABLED: 'false'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Lint repository
        run: bun run lint
      - name: Production build
        run: bun run build
