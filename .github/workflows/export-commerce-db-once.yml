name: One-shot encrypted commerce DB export

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-commerce-db-once.yml'

permissions:
  contents: read

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate source DB secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL:-}" || { echo '::error::DATABASE_URL GitHub Actions secret is missing.'; exit 2; }

      - name: Export resolved commerce tables with PostgreSQL 18
        shell: bash
        run: |
          set -euo pipefail
          docker pull postgres:18 >/dev/null

          cat > /tmp/export-commerce.sh <<'SCRIPT'
          set -euo pipefail
          wanted=(Product Review Category Order Payment PaymentAttempt Refund Invoice CreditNote TrackingEvent WebhookEvent NewsletterSubscriber ContactMessage ProductOffer ProductOfferAudit)
          : > /work/commerce-data.sql
          printf 'logical\tschema\ttable\tcount\n' > /work/counts.tsv
          found=0

          for logical in "${wanted[@]}"; do
            row="$(psql "$DATABASE_URL" -AtF '|' -c "
              select table_schema, table_name
              from information_schema.tables
              where table_type='BASE TABLE'
                and table_schema not in ('pg_catalog','information_schema','auth','storage','realtime','vault','extensions')
                and lower(table_name)=lower('$logical')
              order by case when table_schema='public' then 0 else 1 end, table_schema
              limit 1;" | head -n1)"

            if [ -z "$row" ]; then
              echo "Missing source commerce table: $logical"
              continue
            fi

            schema="${row%%|*}"
            table="${row#*|}"
            pattern="$(psql "$DATABASE_URL" -Atc "select format('%I.%I', '$schema', '$table');")"
            count="$(psql "$DATABASE_URL" -Atc "select count(*) from $pattern;")"
            echo "Resolved $logical -> $pattern ($count rows)"

            pg_dump "$DATABASE_URL" \
              --data-only \
              --inserts \
              --column-inserts \
              --no-owner \
              --no-privileges \
              --table="$pattern" \
              >> /work/commerce-data.sql

            printf '%s\t%s\t%s\t%s\n' "$logical" "$schema" "$table" "$count" >> /work/counts.tsv
            found=$((found+1))
          done

          if [ "$found" -eq 0 ]; then
            echo 'No commerce tables could be resolved.' >&2
            echo 'Available non-system tables:' >&2
            psql "$DATABASE_URL" -AtF '.' -c "
              select table_schema, table_name
              from information_schema.tables
              where table_type='BASE TABLE'
                and table_schema not in ('pg_catalog','information_schema','auth','storage','realtime','vault','extensions')
              order by table_schema, table_name;" >&2
            exit 3
          fi

          echo "Resolved $found commerce tables."
          SCRIPT

          chmod +x /tmp/export-commerce.sh
          docker run --rm \
            -e DATABASE_URL="$DATABASE_URL" \
            -v "$PWD:/work" \
            -v /tmp/export-commerce.sh:/export-commerce.sh:ro \
            postgres:18 \
            bash /export-commerce.sh

      - name: Encrypt dump with temporary public key
        shell: bash
        run: |
          set -euo pipefail
          cat > migration-public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAsiwjXIxRXqR8tNS7GJi7
          2g/icb1RJOBaCYN0bjTJa1eOeEaSvaASDS7qM1H45yozXQ4aRQnT9i+cMs4DjVzN
          rG5GA0EsInYKUavh2QeyBweVqQ3/SGOOshSQejsdVGQsKMe/L4I5pE46cTUd1wIR
          06IS+n3Oodjlc5h1KkK2et+B3USf/PI7ouuE9SeFmtvngCnNRAT49u6yHgl8lR7X
          kbEJ2jh47zKlk9frsY2OvTMA1xq7Bx0bQtq/SGn8A2+9YRxRPAGTKesCTuM1UeGD
          LBcB1DBBMryK4DQb/M3MwX1S1eopVJr+NCw2Zl79RiqJWSzCQ5uSI3udPppaBoE4
          ZCjj8GfMOx5IgknWU+nHjhWIRJ9wBs9GwgJGE72lRCTg172GapOXzfBEEv7XqbNR
          isMBokBrizzYIRmNLo0Kg3Q0wvZ59lp6M+jko5ubJRw9dWLw6TmKaRU9cds9xqaw
          5oq/ZgBcc6ewFUsK7TC6oTASecdwMRD4C31oWYppM4XqvA9E5wYcngLPp0Kzi5LQ
          AfRQIBuVrjFcPKEfZ3Kn30woD42tsbxVSYj1eSZj/XeYqb4sHfx9J3oE3tHbtiUD
          2nfysqpIUw+Ly/DBvkGB3LWQ0qe6cAIQQgW2/rcd/uxRyX6ZmXSnJIyo9irS5CjX
          fARNcTnxfREd+lFuWCXpLp8CAwEAAQ==
          -----END PUBLIC KEY-----
          PEM

          openssl rand -hex 32 > dump-passphrase.txt
          openssl enc -aes-256-cbc -salt -pbkdf2 \
            -in commerce-data.sql \
            -out commerce-data.sql.enc \
            -pass file:dump-passphrase.txt
          openssl pkeyutl -encrypt \
            -pubin -inkey migration-public.pem \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -in dump-passphrase.txt \
            -out dump-passphrase.enc
          shred -u commerce-data.sql dump-passphrase.txt migration-public.pem

      - name: Upload encrypted migration artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecomcasa-commerce-db-encrypted
          path: |
            commerce-data.sql.enc
            dump-passphrase.enc
            counts.tsv
          retention-days: 1
          if-no-files-found: error
