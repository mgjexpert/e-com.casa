name: BigBuy public-index starter import

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/catalog/bigbuy-public-index-seed.json'
      - 'scripts/catalog-suppliers/bigbuy-public-index-import.mjs'
      - '.github/workflows/catalog-bigbuy-public-index.yml'

permissions:
  contents: read

concurrency:
  group: bigbuy-public-index-starter-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate configuration
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo '::error::DATABASE_URL is not configured as a GitHub Actions secret.'
            exit 2
          fi

      - name: Syntax-check importer
        run: node --check scripts/catalog-suppliers/bigbuy-public-index-import.mjs

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Import public indexed BigBuy starter catalogue
        run: node scripts/catalog-suppliers/bigbuy-public-index-import.mjs
